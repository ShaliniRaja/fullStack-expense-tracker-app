# Render Blueprint — lets you deploy this service via "New > Blueprint"
# pointing at this repo, instead of clicking through every setting
# manually. Secrets (sync: false) are never stored here — Render
# prompts you to enter them once, in its own dashboard.
services:
  - type: web
    name: ledger-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
