spring.application.name=ledger-backend


spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Local Mongo by default; in deployment, set the MONGODB_URI environment
# variable to your Atlas connection string (mongodb+srv://...).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ledger_db}

# Render (and most PaaS) inject their own PORT - binding to it is
# required, not optional; hardcoding 8080 would fail to start there.
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# No default here on purpose: this repo is meant to be pushed to GitHub,
# and a real secret should never be committed, even as a "just for dev"
# fallback. Set JWT_SECRET yourself (see README) - startup fails fast
# and clearly if it's missing, rather than silently using a known value.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

logging.level.root=INFO
logging.level.com.ledger.backend=INFO
